# Render.com blueprint — deploy with "New > Blueprint" pointing at this repo.
# Creates: the FastAPI web service + a managed PostgreSQL database.
databases:
  - name: bmis-db
    plan: free
    databaseName: bmis
    user: bmis_user

services:
  - type: web
    name: bmis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bmis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"   # tighten to your actual frontend URL after first deploy
      - key: UPLOAD_DIR
        value: uploads
