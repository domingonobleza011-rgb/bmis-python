<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complaints - Barangay San Pedro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">🏛️ Barangay San Pedro</div>
    <nav>
      <a href="home.html">Home</a>
      <a href="services.html">Services</a>
      <a href="complaints.html" class="active">Complaints</a>
      <a href="messages.html">Messages</a>
      <button id="logoutBtn">Log Out</button>
    </nav>
  </div>
  <div class="container">
    <div class="card">
      <h2>File a Complaint</h2>
      <form id="complaintForm">
        <label>Your Full Name</label>
        <input name="full_name" required>
        <label>Contact Number</label>
        <input name="contact_number">
        <label>Your Address</label>
        <input name="address">
        <label>Category</label>
        <select name="category">
          <option>Noise Disturbance</option><option>Property Dispute</option>
          <option>Public Safety</option><option>Sanitation</option><option>Other</option>
        </select>
        <label>Location of Incident</label>
        <input name="location">
        <label>Description</label>
        <textarea name="description" rows="4" required></textarea>
        <button class="btn" type="submit" style="margin-top:14px;">Submit Complaint</button>
      </form>
    </div>
    <div class="card">
      <h3>My Complaints</h3>
      <div id="complaintsBox">Loading…</div>
    </div>
  </div>

<script>window.API_BASE="https://bmis-backend-dy58.onrender.com";</script>
  <script>
  const session = requireLogin(["resident"]);
  document.getElementById("logoutBtn").onclick = () => { clearSession(); window.location.href = "../index.html"; };

  document.getElementById("complaintForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target).entries());
    try {
      await api("/api/complaints", { method: "POST", body: payload });
      toast("Complaint submitted.");
      e.target.reset();
      loadComplaints();
    } catch (err) { toast(err.message, "error"); }
  });

  async function loadComplaints() {
    try {
      const rows = await api("/api/complaints");
      const box = document.getElementById("complaintsBox");
      if (!rows.length) { box.innerHTML = `<p class="empty">No complaints filed yet.</p>`; return; }
      box.innerHTML = `<table><thead><tr><th>Category</th><th>Description</th><th>Status</th><th>Filed</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${r.category}</td><td>${r.description}</td><td>${badge(r.status)}</td><td>${fmtDate(r.date_submitted)}</td></tr>`).join("")}
      </tbody></table>`;
    } catch (err) { toast(err.message, "error"); }
  }
  loadComplaints();
</script>
</body>
</html>
